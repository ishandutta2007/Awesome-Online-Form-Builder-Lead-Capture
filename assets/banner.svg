<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .float-card-1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .float-card-2 {
      animation: floatMedium 5s ease-in-out infinite alternate-reverse;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.18;
      stroke-dasharray: 4 4;
    }
    .lead-node {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 60px; opacity: 0.25; }
      100% { r: 110px; opacity: 0.55; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatMedium {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes nodePulse {
      0% { fill: #38bdf8; opacity: 0.6; }
      50% { fill: #818cf8; opacity: 1; }
      100% { fill: #c084fc; opacity: 0.7; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="12" />

  <!-- Animated Glowing Nebulas in Background -->
  <circle class="pulse-circle" cx="200" cy="100" r="80" fill="#6366f1" filter="url(#glow)" />
  <circle class="pulse-circle" cx="1020" cy="240" r="95" fill="#a855f7" filter="url(#glow)" style="animation-delay: -2s;" />

  <!-- Subtle Blueprint Tech Grid Lines in Background -->
  <g class="grid-line">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Floating Dynamic Form Input Element 1 (Left background decorative) -->
  <g class="float-card-1" style="transform-origin: 140px 190px;">
    <rect x="50" y="130" width="180" height="120" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="65" y="148" width="60" height="8" rx="4" fill="#38bdf8" fill-opacity="0.8" />
    <rect x="65" y="166" width="150" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="65" y="198" width="70" height="18" rx="5" fill="#6366f1" fill-opacity="0.85" />
    <circle cx="195" cy="207" r="4" class="lead-node" />
  </g>

  <!-- Floating Dynamic Conversion Card 2 (Right background decorative) -->
  <g class="float-card-2" style="transform-origin: 1050px 170px;">
    <rect x="960" y="100" width="190" height="150" rx="10" fill="url(#cardGrad1)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="980" y="120" width="80" height="8" rx="4" fill="#818cf8" />
    <rect x="980" y="140" width="150" height="14" rx="4" fill="#334155" fill-opacity="0.6" />
    <rect x="980" y="162" width="130" height="14" rx="4" fill="#334155" fill-opacity="0.4" />
    <path d="M 980 220 Q 1020 185 1060 205 T 1130 180" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="1130" cy="180" r="4" fill="#10b981" />
    <text x="1060" y="235" fill="#34d399" font-size="11" font-weight="600">Lead +48%</text>
  </g>

  <!-- Centered Foreground Container with Backdrop Blur Protection -->
  <rect x="230" y="45" width="740" height="270" rx="16" fill="#090d16" fill-opacity="0.75" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

  <!-- Badge Pill -->
  <g transform="translate(480, 75)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="0.5">CURATED AWESOME STACK</text>
  </g>

  <!-- Main Hero Titles (Foreground & Crisp) -->
  <text x="600" y="160" text-anchor="middle" font-size="35" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    Online Form Builder &amp; Lead Capture
  </text>

  <text x="600" y="200" text-anchor="middle" font-size="16" font-weight="500" fill="#94a3b8">
    The Definitive Landscape of Conversational Forms, Survey Engines &amp; Self-Hosted Tooling
  </text>

  <!-- Feature Tags / Pills row -->
  <g transform="translate(315, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="125" height="28" rx="14" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="62.5" y="18" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">⚡ High Conversion</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="135" height="28" rx="14" fill="#142c3d" stroke="#0284c7" stroke-width="1" />
    <text x="207.5" y="18" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">💬 Conversational UX</text>

    <!-- Pill 3 -->
    <rect x="290" y="0" width="135" height="28" rx="14" fill="#1a2e26" stroke="#059669" stroke-width="1" />
    <text x="357.5" y="18" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">🛡️ Self-Hosted OSS</text>

    <!-- Pill 4 -->
    <rect x="440" y="0" width="130" height="28" rx="14" fill="#2d1b4e" stroke="#7e22ce" stroke-width="1" />
    <text x="505" y="18" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="600">🔌 CRM &amp; Webhooks</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="295" width="500" height="2" rx="1" fill="url(#titleGrad)" />
</svg>
